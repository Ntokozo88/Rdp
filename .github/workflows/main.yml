name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $username = "Zwiderh"
          $password = "Mpendulo@2026!Rdp"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser -Name $username `
              -Password $securePass `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          Write-Host "RDP user configured successfully."
          Write-Host "Username: $username"
          Write-Host "Password: [hidden]"

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
            Write-Error "Tailscale installer was not downloaded."
            exit 1
          }

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait `
            -NoNewWindow

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
            Write-Error "Tailscale installation failed."
            exit 1
          }

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            Write-Error "Add TAILSCALE_AUTH_KEY to your GitHub repository secrets."
            exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tailscale connection failed."
            exit 1
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $tsIP = (& $tailscale ip -4 | Select-Object -First 1).Trim()

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP assigned."

- name: Start Tailscale File Receiver
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $downloadFolder = "C:\Users\Zwiderh\Downloads"

          New-Item -ItemType Directory `
            -Path $downloadFolder -Force | Out-Null

          $receiver = Start-Process `
            -FilePath $tailscale `
            -ArgumentList @("file", "get", $downloadFolder) `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "File receiver started."
          Write-Host "Receiver process ID: $($receiver.Id)"
          Write-Host "Destination: $downloadFolder"
          
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP connectivity..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed."
            exit 1
          }

          Write-Host "TCP connectivity successful."

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Zwiderh"
          Write-Host "Password: [hidden]"
          Write-Host "=================="
          Write-Host ""

          while ($true) {
            Write-Host "[$(Get-Date)] RDP runner active"
            Start-Sleep -Seconds 300
          }
