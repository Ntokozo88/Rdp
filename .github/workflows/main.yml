name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 2 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "RDP settings configured."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Create the RDP_PASSWORD repository secret first."
          }

          $username = "Zwiderh"
          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existingUser = Get-LocalUser `
            -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:RUNNER_TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
            throw "Tailscale installer download failed."
          }

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed."

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Create the TAILSCALE_AUTH_KEY repository secret first."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $service = Get-Service -Name Tailscale -ErrorAction Stop

          if ($service.Status -ne "Running") {
            Start-Service -Name Tailscale
            Start-Sleep -Seconds 5
          }

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $ipOutput = & $tailscale ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ipOutput) {
              $tsIP = ($ipOutput | Select-Object -First 1).Trim()
            }

            if ($tsIP) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append -Encoding utf8

          Write-Host "Tailscale IP assigned: $tsIP"

      - name: Start Tailscale File Receiver
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $downloadFolder = "C:\Users\Zwiderh\Downloads"

          New-Item -ItemType Directory `
            -Path $downloadFolder -Force | Out-Null

          Write-Host "Checking Tailscale connection..."

          & $tailscale status

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale status failed. File receiver cannot start."
          }

          Write-Host "Starting continuous file receiver..."
          Write-Host "Destination: $downloadFolder"

          $receiver = Start-Process `
            -FilePath $tailscale `
            -ArgumentList @(
              "file",
              "get",
              "--loop",
              "--verbose",
              "--conflict=rename",
              $downloadFolder
            ) `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 3

          $receiver.Refresh()

          if ($receiver.HasExited) {
            throw "Tailscale file receiver exited unexpectedly."
          }

          "TAILSCALE_RECEIVER_PID=$($receiver.Id)" |
            Out-File -FilePath $env:GITHUB_ENV `
              -Append -Encoding utf8

          Write-Host "File receiver started."
          Write-Host "Receiver process ID: $($receiver.Id)"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testing RDP connectivity..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
            throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful."

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: Zwiderh"
          Write-Host "Password: Use your RDP_PASSWORD secret"
          Write-Host "File receiver: Running"
          Write-Host "Download folder: C:\Users\Zwiderh\Downloads"
          Write-Host "================================"
          Write-Host ""

          while ($true) {
            if ($env:TAILSCALE_RECEIVER_PID) {
              $receiver = Get-Process `
                -Id ([int]$env:TAILSCALE_RECEIVER_PID) `
                -ErrorAction SilentlyContinue

              if (-not $receiver) {
                Write-Warning "File receiver stopped. Restarting..."

                $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

                $receiver = Start-Process `
                  -FilePath $tailscale `
                  -ArgumentList @(
                    "file",
                    "get",
                    "--loop",
                    "--verbose",
                    "--conflict=rename",
                    "C:\Users\Zwiderh\Downloads"
                  ) `
                  -PassThru `
                  -WindowStyle Hidden

                "TAILSCALE_RECEIVER_PID=$($receiver.Id)" |
                  Out-File -FilePath $env:GITHUB_ENV `
                    -Append -Encoding utf8

                $env:TAILSCALE_RECEIVER_PID = "$($receiver.Id)"
              }
            }

            Write-Host "[$(Get-Date)] RDP runner active"
            Start-Sleep -Seconds 60
          }
